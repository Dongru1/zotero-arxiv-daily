name: 每日 arXiv
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: write

concurrency:
  group: daily-email
  cancel-in-progress: false

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          OPENREVIEW_USERNAME: ${{ secrets.OPENREVIEW_USERNAME }}
          OPENREVIEW_PASSWORD: ${{ secrets.OPENREVIEW_PASSWORD }}
          PERSIST_OPENREVIEW_STATE: "true"
          RUN_SCOPE: daily
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          echo "Use custom config: "
          cat config/custom.yaml
          uv run src/zotero_arxiv_daily/main.py

      - name: Commit OpenReview state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f data/openreview_state.json ]; then
            git add data/openreview_state.json
          fi
          if [ -d data/embeddings ]; then
            git add data/embeddings
          fi
          if [ -f data/openreview_checkpoint.json ]; then
            git add data/openreview_checkpoint.json
          fi
          if [ -f data/paper_cache.json ]; then
            git add data/paper_cache.json
          fi
          if compgen -G "data/pages/*.html" > /dev/null; then
            git add data/pages/*.html
          fi
          if [ -d data/daily_archive ]; then
            git add data/daily_archive
          fi
          git checkout -- data/pages/manifest.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No daily page changes"
          else
            git commit -m "chore: record daily pages"
          fi
          git checkout -- config/custom.yaml 2>/dev/null || true
          for attempt in 1 2 3 4 5 6 7 8; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 15))
          done
          exit 1

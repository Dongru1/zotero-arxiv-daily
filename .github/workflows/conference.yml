name: Conference digests
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: conference-digest
  cancel-in-progress: false

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.publish.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          OPENREVIEW_USERNAME: ${{ secrets.OPENREVIEW_USERNAME }}
          OPENREVIEW_PASSWORD: ${{ secrets.OPENREVIEW_PASSWORD }}
          PERSIST_OPENREVIEW_STATE: "true"
          RUN_SCOPE: conference
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          echo "Use custom config: "
          cat config/custom.yaml
          uv run src/zotero_arxiv_daily/main.py

      - name: Commit conference state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -f data/openreview_state.json ]; then
            git add data/openreview_state.json
          fi
          if [ -d data/embeddings ]; then
            git add data/embeddings
          fi
          if [ -f data/openreview_checkpoint.json ]; then
            git add data/openreview_checkpoint.json
          fi
          if [ -f data/paper_cache.json ]; then
            git add data/paper_cache.json
          fi
          if compgen -G "data/pages/*.html" > /dev/null; then
            git add data/pages/*.html
          fi
          git checkout -- data/pages/manifest.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No conference state changes"
          else
            git commit -m "chore: record conference state [skip ci]"
          fi
          git checkout -- config/custom.yaml 2>/dev/null || true
          git pull --rebase origin "${GITHUB_REF_NAME}"
          uv run python -c "from zotero_arxiv_daily.publish import publish_results; publish_results([])"
          git add data/pages/manifest.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: refresh pages index [skip ci]"
          fi
          git push

      - name: Check published site
        id: publish
        run: |
          if [ -f site/index.html ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload GitHub Pages artifact
        if: steps.publish.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: calculate-and-send
    if: needs.calculate-and-send.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: 会议精选
on:
  workflow_dispatch:
    inputs:
      venue:
        description: Conference to update
        required: true
        default: all
        type: choice
        options:
          - all
          - iclr
          - neurips
          - icml
          - emnlp
          - acl
          - slt
          - icassp
          - interspeech
  schedule:
    # Monday 12:00 Beijing time. Conference lists do not need a daily run.
    - cron: '0 4 * * 1'

permissions:
  contents: write

jobs:
  venues:
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.set.outputs.list }}
    steps:
      - id: set
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.venue }}" != "all" ]; then
            echo 'list=["${{ inputs.venue }}"]' >> "$GITHUB_OUTPUT"
          else
            echo 'list=["iclr","neurips","icml","emnlp","acl","slt","icassp","interspeech"]' >> "$GITHUB_OUTPUT"
          fi

  calculate-and-send:
    needs: venues
    runs-on: ubuntu-latest
    timeout-minutes: 300
    concurrency:
      group: conference-${{ matrix.venue }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      matrix:
        venue: ${{ fromJson(needs.venues.outputs.list) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}
          fetch-depth: 0

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Run script
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          OPENREVIEW_USERNAME: ${{ secrets.OPENREVIEW_USERNAME }}
          OPENREVIEW_PASSWORD: ${{ secrets.OPENREVIEW_PASSWORD }}
          PERSIST_OPENREVIEW_STATE: "true"
          RUN_SCOPE: conference
          CONFERENCE_VENUE: ${{ matrix.venue }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          echo "Use custom config: "
          cat config/custom.yaml
          uv run src/zotero_arxiv_daily/main.py

      - name: Commit conference state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          venue="${{ matrix.venue }}"
          if [ -f "data/openreview_state/${venue}.json" ]; then
            git add "data/openreview_state/${venue}.json"
          fi
          if [ -d data/embeddings ]; then
            git add data/embeddings
          fi
          if [ -f "data/openreview_checkpoint/${venue}.json" ]; then
            git add "data/openreview_checkpoint/${venue}.json"
          fi
          if [ -f "data/paper_cache/${venue}.json" ]; then
            git add "data/paper_cache/${venue}.json"
          fi
          if compgen -G "data/pages/*.html" > /dev/null; then
            git add data/pages/*.html
          fi
          git checkout -- data/pages/manifest.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No conference state changes"
          else
            git commit -m "chore: record ${venue} conference state"
          fi
          git checkout -- config/custom.yaml 2>/dev/null || true
          for attempt in 1 2 3 4 5 6 7 8; do
            if git pull --rebase origin "${GITHUB_REF_NAME}" && git push; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 15))
          done
          exit 1

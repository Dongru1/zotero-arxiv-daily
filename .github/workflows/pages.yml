name: Publish site
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/pages/**"
  workflow_run:
    # Bot pushes use GITHUB_TOKEN and do not trigger the push event above.
    workflows: ["每日 arXiv", "会议精选"]
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Check page changes
        id: pages
        run: |
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff --name-only HEAD^ HEAD | grep -q '^data/pages/'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup uv
        if: steps.pages.outputs.deploy == 'true'
        uses: astral-sh/setup-uv@v7

      - name: Rebuild site from saved pages
        if: steps.pages.outputs.deploy == 'true'
        run: uv run python -c "from zotero_arxiv_daily.publish import publish_results; publish_results([])"

      - name: Upload GitHub Pages artifact
        if: steps.pages.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.pages.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
